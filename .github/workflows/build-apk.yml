name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Sensex Options Alert APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          test -f SensexOptionsAlertPro_AndroidProject.zip
          unzip -l SensexOptionsAlertPro_AndroidProject.zip | head -40

      - name: Extract Android project
        run: |
          rm -rf SensexOptionsAlertPro
          unzip -o SensexOptionsAlertPro_AndroidProject.zip
          test -f SensexOptionsAlertPro/build.gradle
          test -f SensexOptionsAlertPro/app/build.gradle
          test -f SensexOptionsAlertPro/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android project
        working-directory: SensexOptionsAlertPro
        run: |
          echo "===== settings.gradle ====="
          cat settings.gradle

          echo "===== root build.gradle ====="
          cat build.gradle

          echo "===== app build.gradle ====="
          cat app/build.gradle

      - name: Build Debug APK
        working-directory: SensexOptionsAlertPro
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Check generated APK
        run: |
          ls -lah SensexOptionsAlertPro/app/build/outputs/apk/debug/
          test -f SensexOptionsAlertPro/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SensexOptionsAlertPro-APK
          path: SensexOptionsAlertPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
