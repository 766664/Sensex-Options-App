name: Build Sensex Options Alert APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Sensex Options Alert APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # 1. Download project
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Check ZIP
      - name: Check project ZIP
        run: |
          set -e
          test -f SensexOptionsAlertPro_AndroidProject.zip
          echo "Project ZIP found."

      # 3. Extract Android project
      - name: Extract Android project
        run: |
          set -e

          rm -rf SensexOptionsAlertPro

          unzip -o SensexOptionsAlertPro_AndroidProject.zip

          test -f SensexOptionsAlertPro/build.gradle
          test -f SensexOptionsAlertPro/app/build.gradle
          test -f SensexOptionsAlertPro/app/src/main/AndroidManifest.xml

          echo "Android project verified."

      # 4. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 6. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # 7. Create Sensex icon
      - name: Create Sensex App Icon
        working-directory: SensexOptionsAlertPro
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/drawable
          mkdir -
